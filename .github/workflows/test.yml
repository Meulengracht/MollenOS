name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Check syscall definitions
      run: |
        python3 tools/generate_syscalls.py --check
        python3 -m unittest discover -s tools/tests -p 'test_generate_syscalls.py'
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DVALI_ARCH=amd64 -D__BUILD_UNIT_TESTS=ON
    - name: Build
      run: cmake --build ${{github.workspace}}/build
    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ./run-tests.sh
