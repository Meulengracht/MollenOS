project:
  summary: Vali SDK for C
  description: |
    The base SDK and runtime for the C language. It is required to build any C applications
    against the MollenOS/Vali operating system.
  author: Philip Meulengracht
  email: the_meulengracht@hotmail.com
  version: 1.0.0
  license: LGPL
  homepage: www.mollenos.com

platforms:
  - name: vali
    toolchain: vali/clang-cc=devel
    architectures: [amd64, i386]

environment:
  host:
    packages:
      - cmake
      - python3
      - git
      - gcc
      - g++
      - zip
      - unzip
      - nasm
      - make
      - curl
      - libselinux1-dev
      - libfuse3-dev
  hooks: 
    bash: 'tools/depends.sh install-cmake'

recipes:
- name: vali
  path: /
  toolchain: platform
  steps:
  - name: config
    type: generate
    system: cmake
    arguments: [-G, '"Unix Makefiles"', -DGRACHT_C_LINK_SOCKET=OFF, -DGRACHT_C_LINK_VALI=ON]
    env:
      VALICC: $[[ TOOLCHAIN_PREFIX ]]/usr/local
      VALI_ARCH: $[[ CHEF_TARGET_ARCHITECTURE ]]

  - name: build
    type: build
    depends: [config]
    system: make
    env:
      VALICC: $[[ TOOLCHAIN_PREFIX ]]/usr/local

packs:
- name: sdk-c
  type: ingredient
  filters:
    - !boot
- name: core
  type: bootloader
  filters:
    - boot
