name: vali
author: Philip Meulengracht
email: the_meulengracht@hotmail.com
version: 0.7-dev
license: LGPL
homepage: www.mollenos.com

platforms:
  - name: linux
    toolchain: vali/clang-cc=devel

environment:
  host:
    packages:
      - cmake
      - python3
      - git
      - gcc
      - g++
      - zip
      - unzip
      - nasm
      - make
      - curl
      - libselinux1-dev
      - libfuse3-dev

recipes:
  - name: vali
    path: /
    toolchain: platform
    steps:
    - name: build
      type: build
      system: cmake
      env:
        VALICC: $[[ TOOLCHAIN_PREFIX ]]/usr/local
        VALI_ARCH: $[[ CHEF_TARGET_ARCHITECTURE ]]
      configure:
        arguments: [-DVALI_ARCH=$[[ CHEF_TARGET_ARCHITECTURE ]]]

packs:
  - name: vali
    summary: Vali rootfs image
    description: |
      The base rootfs image for the Vali operating system. Can be converted into
      img or vmdk for booting.
    type: base
    filters:
      - deploy
